[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adn-report-proxy"
version = "0.1.0"
description = "Optional TCP report proxy: adn-server v2 JSON wire to legacy v1 pickle/CSV for old dashboards"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "Twisted>=22.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
adn-report-proxy = "adn_report_proxy.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
